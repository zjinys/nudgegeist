[package]
name = "nudgegeist"
version = "0.1.4"
edition = "2024"
description = "GPUI desktop watchdog and rule engine GUI for luvus AI coding agents"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
gpui = "0.2.2"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
tempfile = "3.27"
unicode-segmentation = "1.13"

[dev-dependencies]
